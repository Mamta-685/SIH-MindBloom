  <circle cx="78" cy="45" r="8" fill="#16a34a"/>
  <circle cx="45" cy="65" r="6" fill="#16a34a"/>
  <circle cx="83" cy="65" r="6" fill="#16a34a"/>
  <circle cx="64" cy="35" r="10" fill="#16a34a"/>
  
  <!-- Small branches -->
  <path d="M40 70C35 65 30 60 25 55" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round"/>
  <path d="M88 70C93 65 98 60 103 55" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round"/>
